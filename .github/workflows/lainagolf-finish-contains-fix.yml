name: LainaGolf finish contains fix

on:
  push:
    paths:
      - '.github/workflows/lainagolf-finish-contains-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch finish condition
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/main/java/pl/laina/golf/LainaGolf.java')
          s = p.read_text(encoding='utf-8')

          old = '''            boolean finishReached = checkpointRequirementMet
                    && (session.map.finishRegion.contains(currentBallCenter)
                    || session.map.finishRegion.intersectsMovement(session.lastBallLocation, currentBallCenter));
          '''
          new = '''            boolean finishReached = checkpointRequirementMet
                    && session.map.finishRegion.contains(currentBallCenter);
          '''

          if old not in s:
              raise SystemExit('finish condition block not found')

          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix
        shell: bash
        run: |
          rm .github/workflows/lainagolf-finish-contains-fix.yml
          git config user.name "LainaGolf Fix Bot"
          git config user.email "actions@github.com"
          git add src/main/java/pl/laina/golf/LainaGolf.java .github/workflows/lainagolf-finish-contains-fix.yml
          git commit -m "Require ball center inside finish blocks"
          git push
